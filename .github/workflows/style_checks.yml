name: Style

on: [push, pull_request]

env:
  rust_version: "1.82.0"

jobs:
  pre_job:
    # continue-on-error: true # Uncomment once integration is finished
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: "same_content_newer"
          skip_after_successful_duplicate: "false"

  check_clippy:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: apt install gstreamer and deps
        run: |
          sudo apt update
          sudo apt install -y aptitude
          sudo aptitude install -y libgstrtspserver-1.0-dev libgstreamer1.0-dev libgtk2.0-dev protobuf-compiler
      # Pinned stable rather than nightly: an unpinned nightly breaks whenever a
      # transitive dependency stops compiling on the newest compiler, which has
      # nothing to do with this code (rustix 0.37 vs current nightly, for one).
      - name: Install rust
        run: |
          rustup toolchain install "${{ env.rust_version }}" --component clippy
          rustup override set "${{ env.rust_version }}"
      - name: Run clippy manually
        run: |
          echo "All Features"
          cargo clippy --workspace --all-targets --all-features || exit 1
          echo "No Features"
          cargo clippy --workspace --all-targets --no-default-features || exit 1
          echo "Gstreamer Only"
          cargo clippy --workspace --all-targets --no-default-features --features=gstreamer || exit 1
          echo "Pushnoti Only"
          cargo clippy --workspace --all-targets --no-default-features --features=pushnoti || exit 1

  check_fmt:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Rust-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        run: |
          rustup toolchain install "${{ env.rust_version }}" --component rustfmt
          rustup override set "${{ env.rust_version }}"
      - name: rustfmt
        run: |
          cargo fmt --all -- --check

  check_lua:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          files: "dissector/baichuan.lua"
          args: --globals Dissector Proto ProtoField base ByteArray DESEGMENT_ONE_MORE_SEGMENT DissectorTable Pref
